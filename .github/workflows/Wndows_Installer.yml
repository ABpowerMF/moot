name: Windows installer

# Builds Moot's Windows installers (.exe and .msi) on every push to main, or by hand from
# the Actions tab. Download them from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - name: Install interface dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Run the tests on Windows
        run: cargo test --workspace --features moot-net/test-relay
      - name: Build installers
        working-directory: apps/desktop
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: moot-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
